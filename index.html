<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隱藏禮物....</title>

    <!-- 🎵 音樂設定區：檔案名稱為 music.mp3 -->
    <audio id="bgm" src="muise.mp3" loop preload="auto"></audio>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; 
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: radial-gradient(circle at center, #e8f4fc 0%, #7db9cb 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        /* 階段 0：精緻神秘信封 */
        #envelope-container {
            width: min(82vw, 330px);
            height: min(54vw, 215px);
            background: #fdfbf7;
            border: 2px solid #e3dec3;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12), 0 5px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
        }

        #envelope-container:active {
            transform: scale(0.96);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: min(41vw, 165px) solid transparent;
            border-right: min(41vw, 165px) solid transparent;
            border-top: min(27vw, 107px) solid #f0ebd8;
            transform-origin: top;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .envelope-text {
            font-size: clamp(1.05rem, 4vw, 1.25rem);
            color: #636e72;
            font-weight: 600;
            margin-top: 45px;
            letter-spacing: 3px;
            pointer-events: none;
        }

        /* 第一階段：從信封中心優雅彈出與等速滑落的信紙 */
        #initial-letter {
            display: none;
            width: min(90vw, 480px);
            padding: clamp(35px, 7vw, 55px) clamp(26px, 6vw, 42px);
            text-align: center;
            position: relative;
            z-index: 10;
            transform: scale(0.3) translateY(40px);
            opacity: 0;
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #initial-letter.show {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        #initial-letter.slide-out {
            transform: scale(0.3) translateY(60px) !important;
            opacity: 0 !important;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        #initial-letter p {
            font-size: clamp(0.95rem, 3.8vw, 1.1rem);
            color: #2d3436;
            line-height: 1.9;
            margin-bottom: 28px;
            text-align: justify;
        }

        .action-btn {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
            border: none;
            padding: 12px 34px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(9, 132, 227, 0.35);
            transition: all 0.3s ease;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            pointer-events: none;
            transition: background-color 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
        }

        /* 11宮格密碼鎖通用樣式 */
        .password-section {
            display: none;
            position: absolute;
            z-index: 25;
            text-align: center;
            opacity: 0;
            transition: opacity 1.2s ease;
            width: min(90vw, 350px);
            padding: 28px;
        }

        .password-section h3 {
            color: #2d3436;
            margin-bottom: 18px;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .pwd-display {
            background: #fff;
            padding: 12px;
            font-size: 1.6rem;
            letter-spacing: 12px;
            border-radius: 16px;
            margin-bottom: 22px;
            border: 1px solid #dfe6e9;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.04);
            height: 56px;
            line-height: 30px;
            color: #2d3436;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key-btn {
            background-color: #f1f2f6;
            border: 1px solid #dfe6e9;
            padding: 16px 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3436;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .key-btn:active {
            background-color: #dfe4ea;
            transform: scale(0.94);
        }

        .key-btn.special {
            background-color: #dfe4ea;
            font-size: 0.95rem;
            color: #636e72;
        }

        /* 第二封信 */
        #second-letter {
            display: none;
            width: min(90vw, 500px);
            padding: clamp(35px, 7vw, 55px) clamp(26px, 6vw, 42px);
            text-align: center;
            position: relative;
            z-index: 30;
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #second-letter.show {
            transform: scale(1);
            opacity: 1;
        }

        #second-letter p {
            font-size: clamp(0.95rem, 3.8vw, 1.1rem);
            color: #2d3436;
            line-height: 1.9;
            margin-bottom: 28px;
            text-align: left;
        }

        /* 抓貓咪遊戲 */
        #game-section {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 40;
            background: radial-gradient(circle at center, #e8f4fc 0%, #7db9cb 100%);
            overflow: hidden;
            touch-action: none;
        }

        #game-instruction {
            position: absolute;
            top: 35px;
            width: 100%;
            text-align: center;
            color: #2d3436;
            font-size: clamp(1.3rem, 5vw, 1.7rem);
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(255,255,255,0.8);
        }

        .running-cat {
            position: absolute;
            cursor: pointer;
            width: clamp(80px, 20vw, 100px);
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
            animation: cat-bounce 0.3s infinite alternate;
            pointer-events: auto; 
        }

        @keyframes cat-bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-14px); }
        }

        .firework-particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: explode 0.9s forwards cubic-bezier(0.1, 0.8, 0.3, 1);
            z-index: 45;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0.15);
                opacity: 0;
            }
        }

        /* 最終告白畫面（背景全黑） */
        #final-proposal {
            display: none;
            position: absolute;
            z-index: 50;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #final-proposal h1 {
            color: #ff7675; 
            font-size: clamp(2rem, 7.5vw, 3.2rem);
            text-shadow: 0 0 30px rgba(255, 118, 117, 0.8);
            letter-spacing: 3px;
            font-weight: 800;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .return-btn {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ff7675;
            border: 2px solid #ff7675;
            padding: 12px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 118, 117, 0.25);
        }

        .return-btn:active {
            background-color: #ff7675;
            color: white;
        }
    </style>
</head>
<body>

    <!-- 神秘信封 -->
    <div id="envelope-container" title="點擊開啟信件">
        <div class="envelope-flap" id="envelope-flap"></div>
        <div class="envelope-text">有一封信等妳開啟</div>
    </div>

    <!-- 第一封信 -->
    <div id="initial-letter" class="glass-panel">
        <p>莊織希!不敢相信妳居然可以把這個密碼破解開來。同時也許妳也獲得了我非常巨大的信任，我才敢給妳這個。因為為了給妳這個，我也許要先做好心理準備。要麼傷心，要麼非常開心。</p>
        <button class="action-btn" id="close-letter-btn">關閉紙條</button>
    </div>

    <div id="fade-overlay"></div>

    <!-- 第一個密碼鎖 (密碼：2702) -->
    <div id="password-section-1" class="password-section glass-panel">
        <h3>請輸入解鎖密碼</h3>
        <div class="pwd-display" id="pwd-display-1">----</div>
        <div class="keypad-grid">
            <button class="key-btn" onclick="pressKey(1, '1')">1</button>
            <button class="key-btn" onclick="pressKey(1, '2')">2</button>
            <button class="key-btn" onclick="pressKey(1, '3')">3</button>
            <button class="key-btn" onclick="pressKey(1, '4')">4</button>
            <button class="key-btn" onclick="pressKey(1, '5')">5</button>
            <button class="key-btn" onclick="pressKey(1, '6')">6</button>
            <button class="key-btn" onclick="pressKey(1, '7')">7</button>
            <button class="key-btn" onclick="pressKey(1, '8')">8</button>
            <button class="key-btn" onclick="pressKey(1, '9')">9</button>
            <button class="key-btn special" onclick="pressKey(1, 'del')">刪除</button>
            <button class="key-btn" onclick="pressKey(1, '0')">0</button>
            <button class="key-btn special" onclick="pressKey(1, 'ok')">確認</button>
        </div>
    </div>

    <!-- 第二封信 -->
    <div id="second-letter" class="glass-panel">
        <p>莊織希...我很希望這一天的到來。我每天都在期待和緊張的等。然後，妳看完這封信之後，我希望，如果您不同意的話，我們以後可以繼續做朋友。那如果妳同意的話，我願意把我的命都獻給妳。</p>
        <button class="action-btn" id="start-game-btn">點擊繼續</button>
    </div>

    <!-- 抓貓咪遊戲 -->
    <div id="game-section">
        <div id="game-instruction">嘗試抓到貓</div>
        <img src="cat-icon.png" alt="貓咪" class="running-cat" id="cat" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2290%22 height=%2290%22><text x=%2210%22 y=%2270%22 font-size=%2265%22>🐈</text></svg>'">
    </div>

    <!-- 第二個密碼鎖 (密碼：0729) -->
    <div id="password-section-2" class="password-section glass-panel">
        <h3>請輸入最終解鎖密碼</h3>
        <div class="pwd-display" id="pwd-display-2">----</div>
        <div class="keypad-grid">
            <button class="key-btn" onclick="pressKey(2, '1')">1</button>
            <button class="key-btn" onclick="pressKey(2, '2')">2</button>
            <button class="key-btn" onclick="pressKey(2, '3')">3</button>
            <button class="key-btn" onclick="pressKey(2, '4')">4</button>
            <button class="key-btn" onclick="pressKey(2, '5')">5</button>
            <button class="key-btn" onclick="pressKey(2, '6')">6</button>
            <button class="key-btn" onclick="pressKey(2, '7')">7</button>
            <button class="key-btn" onclick="pressKey(2, '8')">8</button>
            <button class="key-btn" onclick="pressKey(2, '9')">9</button>
            <button class="key-btn special" onclick="pressKey(2, 'del')">刪除</button>
            <button class="key-btn" onclick="pressKey(2, '0')">0</button>
            <button class="key-btn special" onclick="pressKey(2, 'ok')">確認</button>
        </div>
    </div>

    <!-- 最終告白 -->
    <div id="final-proposal">
        <h1>莊織希 我喜歡妳!<br>妳願意做我女朋友嗎？ ❤️</h1>
        <button class="return-btn" id="return-btn">返回初始畫面</button>
    </div>

    <script>
        const bgm = document.getElementById('bgm');
        const envelopeContainer = document.getElementById('envelope-container');
        const envelopeFlap = document.getElementById('envelope-flap');
        const initialLetter = document.getElementById('initial-letter');
        const closeLetterBtn = document.getElementById('close-letter-btn');
        const fadeOverlay = document.getElementById('fade-overlay');
        const passwordSection1 = document.getElementById('password-section-1');
        const pwdDisplay1 = document.getElementById('pwd-display-1');
        const secondLetter = document.getElementById('second-letter');
        const startGameBtn = document.getElementById('start-game-btn');
        const gameSection = document.getElementById('game-section');
        const cat = document.getElementById('cat');
        const passwordSection2 = document.getElementById('password-section-2');
        const pwdDisplay2 = document.getElementById('pwd-display-2');
        const finalProposal = document.getElementById('final-proposal');
        const returnBtn = document.getElementById('return-btn');

        let pwd1 = '';
        const correctPwd1 = '2702';

        let pwd2 = '';
        const correctPwd2 = '0729';

        // 點擊信封打開的瞬間：精準觸發音樂播放，並讓信紙優雅彈出
        envelopeContainer.addEventListener('click', () => {
            bgm.play().catch(err => {
                console.log("音樂播放等待互動解鎖：", err);
            });

            envelopeFlap.style.transform = 'rotateX(180deg)';
            
            setTimeout(() => {
                envelopeContainer.style.opacity = '0';
                setTimeout(() => {
                    envelopeContainer.style.display = 'none';
                    initialLetter.style.display = 'block';
                    setTimeout(() => {
                        initialLetter.classList.add('show');
                    }, 40);
                }, 350);
            }, 300);
        });

        // 關閉信紙：以完全等速、優雅的動畫滑落離開
        closeLetterBtn.addEventListener('click', () => {
            initialLetter.classList.add('slide-out');
            setTimeout(() => {
                initialLetter.style.display = 'none';
                initialLetter.classList.remove('show', 'slide-out');
                fadeOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';
                passwordSection1.style.display = 'block';
                setTimeout(() => { passwordSection1.style.opacity = '1'; }, 50);
            }, 700);
        });

        // 通用密碼輸入邏輯
        window.pressKey = function(lockId, key) {
            if (lockId === 1) {
                if (key === 'del') {
                    pwd1 = pwd1.slice(0, -1);
                } else if (key === 'ok') {
                    if (pwd1 === correctPwd1) {
                        passwordSection1.style.opacity = '0';
                        setTimeout(() => {
                            passwordSection1.style.display = 'none';
                            fadeOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                            secondLetter.style.display = 'block';
                            setTimeout(() => { secondLetter.classList.add('show'); }, 50);
                        }, 700);
                    } else {
                        alert('密碼不對喔，再試一次！');
                        pwd1 = '';
                    }
                } else {
                    if (pwd1.length < 4) pwd1 += key;
                }
                pwdDisplay1.textContent = pwd1.padEnd(4, '-');
            } else if (lockId === 2) {
                if (key === 'del') {
                    pwd2 = pwd2.slice(0, -1);
                } else if (key === 'ok') {
                    if (pwd2 === correctPwd2) {
                        passwordSection2.style.opacity = '0';
                        setTimeout(() => {
                            passwordSection2.style.display = 'none';
                            document.body.style.backgroundColor = '#000000'; // 沉浸式全黑背景
                            finalProposal.style.display = 'flex';
                            setTimeout(() => { finalProposal.style.opacity = '1'; }, 100);
                        }, 700);
                    } else {
                        alert('密碼不對喔，再試一次！');
                        pwd2 = '';
                    }
                } else {
                    if (pwd2.length < 4) pwd2 += key;
                }
                pwdDisplay2.textContent = pwd2.padEnd(4, '-');
            }
        };

        startGameBtn.addEventListener('click', () => {
            secondLetter.classList.remove('show');
            setTimeout(() => {
                secondLetter.style.display = 'none';
                gameSection.style.display = 'block';
                startCatMovement();
            }, 700);
        });

        let catInterval;
        function startCatMovement() {
            cat.style.display = 'block';
            moveCatRandomly();
            catInterval = setInterval(moveCatRandomly, 600);
        }

        function moveCatRandomly() {
            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 100;
            const randomX = Math.floor(Math.random() * Math.max(50, maxX));
            const randomY = Math.floor(Math.random() * Math.max(50, maxY));
            cat.style.left = randomX + 'px';
            cat.style.top = randomY + 'px';
        }

        // 點擊貓咪：煙火炸開 -> 淡入第二個密碼鎖 (0729)
        cat.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            clearInterval(catInterval);
            const rect = cat.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            cat.style.display = 'none';
            document.getElementById('game-instruction').style.display = 'none';

            createFireworks(x, y);

            setTimeout(() => {
                gameSection.style.display = 'none';
                fadeOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';
                passwordSection2.style.display = 'block';
                setTimeout(() => {
                    passwordSection2.style.opacity = '1';
                }, 100);
            }, 800);
        });

        function createFireworks(x, y) {
            const colors = ['#ff7675', '#55efc4', '#74b9ff', '#ffeaa7', '#a29bfe', '#fd79a8', '#00cec9', '#fab1a0'];
            const particleCount = 75;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                
                const size = Math.floor(Math.random() * 10) + 6;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 260 + 50;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 900);
            }
        }

        // 返回初始畫面
        returnBtn.addEventListener('click', () => {
            finalProposal.style.opacity = '0';
            setTimeout(() => {
                finalProposal.style.display = 'none';
                document.body.style.backgroundColor = ''; 
                
                pwd1 = '';
                pwd2 = '';
                pwdDisplay1.textContent = '----';
                pwdDisplay2.textContent = '----';
                fadeOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                envelopeFlap.style.transform = 'rotateX(0deg)';
                envelopeContainer.style.opacity = '1';
                envelopeContainer.style.display = 'flex';
            }, 1000);
        });
    </script>
</body>
</html>
